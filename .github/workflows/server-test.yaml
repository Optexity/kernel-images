name: Test for the server/ directory

# Runs on any push/PR targeting the default branch (optexity)
on:
  push:
    branches: ["optexity"]
  pull_request:
    branches: ["optexity"]
  workflow_dispatch:

jobs:
  build-headful:
    uses: ./.github/workflows/chromium-headful-image.yaml
    secrets: inherit

  build-headless:
    uses: ./.github/workflows/chromium-headless-image.yaml
    secrets: inherit

  test:
    runs-on: ubuntu-latest
    needs: [build-headful, build-headless]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "server/go.mod"
          cache: true

      - name: Compute image vars
        id: vars
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$owner" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run server Makefile tests
        run: make test
        working-directory: server
        env:
          E2E_CHROMIUM_HEADFUL_IMAGE: ghcr.io/${{ steps.vars.outputs.owner }}/optexity-kernel-headful:latest
          E2E_CHROMIUM_HEADLESS_IMAGE: ghcr.io/${{ steps.vars.outputs.owner }}/optexity-kernel-headless:latest
